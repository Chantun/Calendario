<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calendario</title>
		<link rel="icon" type="svg" href="./icon.svg" sizes="16x16" />
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<div id="authModal">
			<div id="login-div" class="authModal--div">
				<h3>Login</h3>
				<input id="user" type="text" placeholder="Usuario" /><br /><br />
				<input id="pass" type="password" placeholder="Password" /><br /><br />
				<input
					id="pass2"
					type="password"
					placeholder="Confirm Password"
					style="display: none"
				/><br />
				<button id="login_button">OK</button>
				<button id="send_register" style="display: none">OK</button>
				<button id="register_button">Register</button>
				<span class="error_text"></span>
			</div>
		</div>
		<div id="error_section"></div>
		<main id="main" style="display: none">
			<section id="add-section">
				<h2 class="title">Add</h2>
				<select name="options" id="add-options" autocomplete="off">
					<option value="" disabled selected hidden>N/A</option>
					<option value="materia">Materia</option>
					<option value="horario">Horario</option>
					<option value="event">Evento</option>
					<option value="period">Periodo</option>
					<option value="holiday">Feriado</option>
				</select>
				<div id="add-content" class="content"></div>
			</section>
			<section id="modify-section">
				<h2 class="title">Modify</h2>
				<select name="options" id="modify-options" autocomplete="off">
					<option value="" disabled selected hidden>N/A</option>
					<option value="materia">Materia</option>
					<option value="horario">Horario</option>
					<option value="event">Evento</option>
					<option value="period">Periodo</option>
					<option value="holiday">Feriado</option>
				</select>
				<div id="modify-content" class="content content--flex">
					<table id="modify-table" class="table"></table>
					<div id="edit-table" class="edit"></div>
				</div>
			</section>
			<section class="admin-section">
				<h2 class="title">Admins</h2>
				<div id="admin-content" class="content--tiny content--flex">
					<table id="admin-table" class="table"></table>
				</div>
			</section>
		</main>
	</body>
	<script type="module" src="js/admin/login.mjs"></script>
</html>
