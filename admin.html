<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calendario</title>
		<link rel="icon" type="svg" href="./icon.svg" sizes="16x16" />
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<div id="authModal">
			<div id="login-div" class="authModal--div">
				<h3>Login</h3>
				<input
					id="user"
					type="text"
					placeholder="Usuario"
					class="input-modal input-modal--text"
				/><br /><br />
				<input
					id="pass"
					type="password"
					placeholder="Password"
					class="input-modal input-modal--text"
				/><br /><br />
				<input
					id="pass2"
					type="password"
					placeholder="Confirm Password"
					class="input-modal input-modal--text"
					style="display: none"
				/><br />
				<div class="buttons-container">
					<button id="login_button">OK</button>
					<button id="send_register" style="display: none">OK</button>
					<button id="register_button">Register</button>
				</div>
				<span class="error_text error"></span>
			</div>
		</div>
		<main id="main" style="display: none">
			<div id="inputModal">
				<div id="input-div" class="inputModal--div">
					<div id="inputModal--content"></div>
					<button id="addSubmit" class="submit-button">Aceptar</button>
					<button id="cancelModal" class="submit-button">Cancelar</button>
					<p class="error"></p>
				</div>
			</div>
			<div id="backupModal">
				<div id="backup-div" class="inputModal--div">
					<div id="backupModal--content"></div>
					<div class="buttons-container">
						<button id="useBackup" class="submit-button">Cargar</button>
						<button id="deleteBackup" class="submit-button">Borrar</button>
					</div>
					<button id="cancel-backup" class="submit-button">Cancelar</button>
					<p class="error"></p>
				</div>
			</div>
			<section id="add-section" class="section">
				<h2 class="title title--dark">Añadir</h2>
				<h3 class="int-list__subtitle">Academico:</h3>
				<div class="add-row">
					<p id="addMateria" class="int-list--item">
						[ <span class="icon_before icon_materia"></span> Materia ]
					</p>
					<p id="addHorario" class="int-list--item">
						[ <span class="icon_before icon_horario"></span> Horario ]
					</p>
				</div>
				<h3 class="int-list__subtitle">Calendario:</h3>
				<div class="add-row">
					<p id="addEvent" class="int-list--item">
						[ <span class="icon_before icon_event"></span> Evento ]
					</p>
					<p id="addPeriod" class="int-list--item">
						[ <span class="icon_before icon_period"></span> Periodo ]
					</p>
					<p id="addHoliday" class="int-list--item">
						[ <span class="icon_before icon_holiday icon_red"></span> Feriado ]
					</p>
				</div>
				<h3 class="int-list__subtitle">Otros:</h3>
				<div class="add-row">
					<p id="addBackup" class="int-list--item">
						[ <span class="icon_before icon_backup"></span> Backup ]
					</p>
				</div>
				<div id="add-content" class="content"></div>
			</section>
			<section id="modify-section" class="section">
				<h2 class="title title--dark">Modificar</h2>
				<select
					name="options"
					id="modify-options"
					autocomplete="off"
					class="input-modal input-modal--text input-modal--select"
				>
					<option value="" disabled selected hidden>N/A</option>
					<option value="materia">Materia</option>
					<option value="horario">Horario</option>
					<option value="event">Evento</option>
					<option value="period">Periodo</option>
					<option value="holiday">Feriado</option>
				</select>
				<div id="modify-content" class="content">
					<table id="modify-table" class="table"></table>
				</div>
			</section>
			<section class="section others-section">
				<div id="admin-content" class="content">
					<h2 class="title title--dark">Admins</h2>
					<table id="admin-table" class="table"></table>
				</div>
				<div id="backup-content" class="content">
					<h2 class="title title--dark">Backups</h2>
					<table id="backup-table" class="table"></table>
				</div>
			</section>
		</main>
	</body>
	<script type="module" src="js/admin/login.mjs"></script>
</html>
